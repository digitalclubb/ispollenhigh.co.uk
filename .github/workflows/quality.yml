name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel to finish deploying this commit
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: vercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
      - name: Run Lighthouse on production URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ispollenhigh.co.uk/
            https://ispollenhigh.co.uk/london
            https://ispollenhigh.co.uk/sw
            https://ispollenhigh.co.uk/region/south-east
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # We test the production domain directly rather than the Vercel
      # deployment-specific URL. The deployment URL is gated behind Vercel
      # auth (401), the production domain is public.
      #
      # The gate polls /locations, not /api/health: health answers 200 from
      # the *previous* deployment too, so Lighthouse could start auditing
      # before the new build is promoted and score 404 pages for the URLs
      # added in that build. A page that only exists in the new build is the
      # only honest readiness signal, and it costs no Google Pollen quota
      # because it is prerendered.
      # Vercel's Bot Protection ruleset challenges anything that doesn't
      # behave like a browser, which includes this curl and Lighthouse's
      # headless Chrome running from a datacenter IP: both get HTTP 429 with
      # `x-vercel-mitigated: challenge`. Verified crawlers like Googlebot are
      # excluded from the ruleset automatically, so this is CI's problem
      # only. A WAF custom rule with a Bypass action, matching the header
      # below and ordered above the managed rulesets, lets CI through — see
      # docs/RUNBOOK.md for the rule and the secret.
      - name: Wait for the new deployment to be live
        env:
          WAF_BYPASS_TOKEN: ${{ secrets.WAF_BYPASS_TOKEN }}
        run: |
          for i in $(seq 1 36); do
            if curl -sf -o /dev/null --max-time 5 \
              -H "x-waf-bypass: $WAF_BYPASS_TOKEN" \
              "https://ispollenhigh.co.uk/locations"; then
              echo "Production reachable on attempt $i"
              exit 0
            fi
            echo "Attempt $i: not yet reachable, waiting..."
            sleep 5
          done
          echo "Timed out waiting for production"
          exit 1

      # Lighthouse needs the same header, and the config file is committed,
      # so the token is injected into a throwaway copy at run time.
      - name: Add the WAF bypass header to the Lighthouse config
        env:
          WAF_BYPASS_TOKEN: ${{ secrets.WAF_BYPASS_TOKEN }}
        run: |
          jq --arg token "$WAF_BYPASS_TOKEN" \
            '.ci.collect.settings.extraHeaders = ("{\"x-waf-bypass\":\"" + $token + "\"}")' \
            .lighthouserc.json > .lighthouserc.ci.json

      - name: Run Lighthouse on production URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ispollenhigh.co.uk/
            https://ispollenhigh.co.uk/london
            https://ispollenhigh.co.uk/skegness
            https://ispollenhigh.co.uk/sw
            https://ispollenhigh.co.uk/region/south-east
            https://ispollenhigh.co.uk/locations
            https://ispollenhigh.co.uk/pollen-calendar
          configPath: ./.lighthouserc.ci.json
          uploadArtifacts: true
          temporaryPublicStorage: true

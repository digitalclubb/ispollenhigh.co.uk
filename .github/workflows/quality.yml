name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # We test the production domain directly rather than the Vercel
      # deployment-specific URL. The deployment URL is gated behind Vercel
      # auth (401), the production domain is public. Polling /api/health
      # in skip mode gives us a cheap readiness signal without burning
      # Google Pollen quota.
      - name: Wait for production to be reachable
        run: |
          for i in $(seq 1 36); do
            if curl -sf -o /dev/null --max-time 5 "https://ispollenhigh.co.uk/api/health?upstream=skip"; then
              echo "Production reachable on attempt $i"
              exit 0
            fi
            echo "Attempt $i: not yet reachable, waiting..."
            sleep 5
          done
          echo "Timed out waiting for production"
          exit 1

      - name: Run Lighthouse on production URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ispollenhigh.co.uk/
            https://ispollenhigh.co.uk/london
            https://ispollenhigh.co.uk/sw
            https://ispollenhigh.co.uk/region/south-east
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
